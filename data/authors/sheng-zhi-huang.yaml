  I am an Assistant Professor at Tamkang University. My research focuses on UAV Networks, Multi-Access Edge Computing, and emerging wireless technologies. I received my Ph.D. from National Central University in 2023, and was a Visiting Scholar at Iowa State University (2022-2023) under NSTC's Graduate Students Study Abroad Program.
